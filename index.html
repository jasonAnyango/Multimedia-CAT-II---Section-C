<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Save Our Wildlife</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Save Our Wildlife</h1>

      <div class="video-wrapper">
        <video
          id="wildlife-video"
          controls
          aria-label="Wildlife conservation promotional video"
        >
          <source src="wildlife.mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
      </div>

      <p class="description">
        Every species lost is a thread pulled from the fabric of life. Join us
        in protecting the world's most vulnerable wildlife — because nature
        cannot wait. Your support helps fund conservation efforts, protect
        natural habitats, and ensure future generations inherit a living planet.
      </p>

      <button id="toggle-btn" aria-pressed="false" onclick="toggleVideo()">
        Play Video
      </button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
